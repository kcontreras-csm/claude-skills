name: Skills

# Validates every skill and keeps skills.json (the list Satellite's skills store reads) up to date.
#   - Pull requests: validate only.
#   - Pushes to main: validate, regenerate skills.json and commit it if it changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skills and generate skills.json
        run: python3 scripts/generate_skills.py

      - name: Commit the updated skills.json
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- skills.json)" ]; then
            echo "skills.json is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills.json
            git commit -m "Update skills.json"
            git push
          fi
